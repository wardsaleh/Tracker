<title>Daily Tracker</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#6e6e73;--ac:#0a84ff;--ok:#30b05a;--bd:#e3e3e8;--bar:#ececf1;--bad:#ff453a;--nap:#af7cf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--bd:#2c2c2e;--bar:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--bd:#2c2c2e;--bar:#2c2c2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{width:100%;max-width:560px;margin:0 auto;padding:8px 16px 24px;flex:1}
h1{font-size:30px;margin:8px 0 14px}h2{font-size:17px;margin:0 0 10px}p{margin:8px 0}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:14px}.big{font-size:30px;font-weight:700}.r{text-align:right}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}.bar i.ok{background:var(--ok)}
input,select,button{font:inherit;color:var(--tx);background:var(--bar);border:0;border-radius:10px;padding:10px 12px;min-width:0}
input,select{width:100%;margin-top:6px}
.add{display:flex;gap:8px;margin-top:6px}.add input{margin-top:0}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;font-weight:600}button.dng{color:var(--bad);background:none;padding:6px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}
.chips{display:flex;gap:6px;margin:0 0 12px}.chips button{flex:1}.chips .on{background:var(--ac);color:#fff}
.chip{display:inline-block;background:var(--bar);border-radius:16px;padding:5px 10px;margin:3px 4px 3px 0;font-size:14px}.chip a{color:var(--bad);margin-left:4px;cursor:pointer}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}.li:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
input[type=checkbox]{width:22px;height:22px;padding:0;margin:0 10px 0 0}
.ch{width:100%;height:auto}.ch .s0{fill:var(--ac)}.ch .s0.ok{fill:var(--ok)}.ch .s1{fill:var(--nap)}.ch .ln{stroke:var(--mu);stroke-dasharray:4 3}.ch text{fill:var(--mu);font-size:9px}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{background:none;border-radius:0;padding:8px 0 6px;font-size:10px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:20px}nav .on{color:var(--ac)}
#t{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
</style></head><body>
<main id="m"></main><nav id="n"></nav><div id="t"></div>
<script>
const K='dailytracker.v1',U=['times','ml','L','cal','km','steps','pages','minutes','hours','kg','glasses'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({habits:[],logs:{},sleep:{goal:8,s:[]},cats:['Food','Transport','Clothes','Bills','Health','Entertainment','Other'],spend:[],week:{mon:'',items:[]}},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),p2=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>dk(new Date());
const addD=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)};
const sd=k=>new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toLocaleString(undefined,{maximumFractionDigits:1}),fm2=n=>'QAR '+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const F={},v=(k,d='')=>esc(F[k]??d);
let tab='today',ed='',arm='',stH='',stR=7,slR=7,spM='m',cy=new Date().getFullYear(),cm=new Date().getMonth();
const toast=m=>{const t=$('#t');t.textContent=m;t.style.opacity=1;clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.opacity=0,2400)};
const conf=(key,fn)=>{if(arm===key){arm='';fn()}else{arm=key;go();setTimeout(()=>{if(arm===key){arm='';go()}},3000)}};
const amt=(h,k)=>(S.logs[h.id]||{})[k]||0,pct=(h,k)=>h.goal>0?amt(h,k)/h.goal*100:0,hit=(h,k)=>pct(h,k)>=100;
const allHit=k=>S.habits.length>0&&S.habits.every(h=>hit(h,k));
const run=f=>{let k=today(),n=0;if(!f(k))k=addD(k,-1);while(f(k)){n++;k=addD(k,-1)}return n};
const best=h=>{const ks=Object.keys(S.logs[h.id]||{}).sort();if(!ks.length)return 0;let b=0,c=0,k=ks[0];const e=today();while(k<=e){if(hit(h,k)){c++;b=Math.max(b,c)}else c=0;k=addD(k,1)}return b};
const bar=p=>`<div class=bar><i class="${p>=100?'ok':''}" style="width:${Math.min(p,100)}%"></i></div>`;
const empty=m=>`<h1>${TABS.find(t=>t[0]==tab)[2]}</h1><div class="card mu">${m||'Add a habit in the Habits tab first.'}</div>`;
const chips=(vals,cur,vr,lab)=>`<div class=chips>${vals.map(x=>`<button class="${x==cur?'on':''}" onclick="${vr}='${x}';go()">${lab?lab(x):x+(vr=='spM'?'':'d')}</button>`).join('')}</div>`;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

function bars(cols,line,lf){const W=340,H=150,pl=30,pb=16,n=cols.length,mx=Math.max(line||0,...cols.map(c=>c.v.reduce((a,b)=>a+b,0)),1)*1.1,bw=(W-pl)/n,y=x=>H-pb-(H-pb-6)*x/mx;let s=`<svg viewBox="0 0 ${W} ${H}" class=ch>`;
cols.forEach((c,i)=>{let a=0;c.v.forEach((x,j)=>{const y0=y(a),y1=y(a+x);a+=x;if(x>0)s+=`<rect x="${pl+i*bw+bw*.15}" y="${y1}" width="${bw*.7}" height="${y0-y1}" class="s${j}${c.ok?' ok':''}"/>`});
if(n<=14||i%Math.ceil(n/6)==0)s+=`<text x="${pl+i*bw+bw/2}" y="${H-3}" text-anchor="middle">${c.t}</text>`});
s+=`<line x1="${pl}" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--bd)"/>`;
if(line)s+=`<line class=ln x1="${pl}" x2="${W}" y1="${y(line)}" y2="${y(line)}"/><text x="0" y="${y(line)+3}">${lf(line)}</text>`;
return s+'</svg>'}
const sh=k=>+k.slice(5,7)+'/'+ +k.slice(8,10);

/* TODAY */
function vToday(){const H=S.habits,k=today();if(!H.length)return empty();
const ov=avg(H.map(h=>Math.min(pct(h,k),100)));
return `<h1>Today</h1><div class=card><div class=row><div><div class=big>${Math.round(ov)}%</div><div class=mu>of today’s goals</div></div><div class=r><div class=big>🔥 ${run(allHit)}</div><div class=mu>day streak (all habits)</div></div></div>${bar(ov)}</div>`+
H.map(h=>{const a=amt(h,k),p=pct(h,k),e=ed==='d'+h.id;return `<div class=card><div class=row><b>${esc(h.name)}</b><span class=mu>🔥 ${run(x=>hit(h,x))} day streak</span></div><div class=mu>${fmt(a)} of ${fmt(h.goal)} ${esc(h.unit)} · ${Math.round(p)}%</div>${bar(p)}`+
(e?`<div class=add><input type=number inputmode=decimal step=any value="${v('et')}" oninput="F.et=this.value"><button class=pri onclick="setAmt('${h.id}')">Save total</button><button onclick="ed='';go()">✕</button></div>`:
`<div class=add><input id=a${h.id} type=number inputmode=decimal step=any placeholder="Add amount"><button class=pri onclick="addAmt('${h.id}')">Add</button><button onclick="ed='d${h.id}';F.et=${a};go()">Edit</button></div>`)+`</div>`}).join('')}
function addAmt(id){const x=parseFloat($('#a'+id).value);if(!isFinite(x)||!x)return;const L=S.logs[id]=S.logs[id]||{},k=today();L[k]=Math.max(0,(L[k]||0)+x);save();go()}
function setAmt(id){const x=parseFloat(F.et);if(!isFinite(x)||x<0)return toast('Enter a number');(S.logs[id]=S.logs[id]||{})[today()]=x;ed='';save();go()}

/* STATS */
function vStats(){const H=S.habits;if(!H.length)return empty();
const h=H.find(x=>x.id===stH)||H[0];stH=h.id;const n=stR,k0=today(),days=[...Array(n)].map((_,i)=>addD(k0,i-n+1)),tot=days.reduce((a,k)=>a+amt(h,k),0);
const wk=(x,o)=>avg([...Array(7)].map((_,i)=>pct(x,addD(k0,-i-o))));
const cmp=H.map(x=>{const a=wk(x,0),b=wk(x,7),d=Math.round(a-b);return `<tr><td>${esc(x.name)}</td><td>${Math.round(a)}%</td><td>${Math.round(b)}%</td><td style="color:var(${d>=0?'--ok':'--bad'})">${d>=0?'▲':'▼'} ${Math.abs(d)}</td></tr>`}).join('');
const rec=days.slice(-10).reverse().map(k=>`<div class=li><span>${sd(k)}</span><span>${fmt(amt(h,k))} ${esc(h.unit)} · <b>${Math.round(pct(h,k))}%</b></span></div>`).join('');
return `<h1>Stats</h1><select onchange="stH=this.value;go()">${H.map(x=>`<option value="${x.id}" ${x.id==h.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div style="height:10px"></div>${chips([7,14,30,90],stR,'stR')}
<div class=card><h2>Daily % of goal</h2>${bars(days.map(k=>({v:[pct(h,k)],t:sh(k),ok:hit(h,k)})),100,x=>x+'%')}</div>
<div class=grid><div class=stat><span class=mu>Current streak</span><b>🔥 ${run(x=>hit(h,x))}</b></div><div class=stat><span class=mu>Best streak</span><b>${best(h)}</b></div>
<div class=stat><span class=mu>Goals hit</span><b>${days.filter(k=>hit(h,k)).length} / ${n}</b></div><div class=stat><span class=mu>Total</span><b>${fmt(tot)} <small>${esc(h.unit)}</small></b></div>
<div class=stat><span class=mu>Daily average</span><b>${fmt(tot/n)} <small>${esc(h.unit)}</small></b></div></div>
<div class=card><h2>Last 7 days vs the 7 before</h2><table><tr><th></th><th>Last 7</th><th>Prev 7</th><th>Change</th></tr>${cmp}</table></div>
<div class=card><h2>Recent days</h2>${rec}</div>`}

/* SLEEP */
const dur=x=>(new Date(x.b)-new Date(x.a))/36e5,isN=x=>x.t==='Night sleep',mn=s=>+s.slice(11,13)*60+ +s.slice(14,16);
const hm=h=>{const t=Math.round(h*60);return Math.floor(t/60)+'h '+p2(t%60)+'m'};
const t12=m=>{m=Math.round(m)%1440;const h=Math.floor(m/60);return ((h%12)||12)+':'+p2(m%60)+(h<12?' AM':' PM')};
function dayAgg(){const o={};S.sleep.s.forEach(x=>{const k=x.b.slice(0,10),d=o[k]=o[k]||{n:0,p:0,a:[],b:[]};isN(x)?d.n+=dur(x):d.p+=dur(x);d.a.push(x.a);d.b.push(x.b)});
for(const k in o){const d=o[k];d.bed=mn(d.a.sort()[0]);if(d.bed<720)d.bed+=1440;d.wk=mn(d.b.sort().pop());d.t=d.n+d.p}return o}
function vSleep(){const D=dayAgg(),g=S.sleep.goal,n=slR,k0=today(),days=[...Array(n)].map((_,i)=>addD(k0,i-n+1)),L=days.filter(k=>D[k]);
if(!F.za){F.zt=F.zt||'Night sleep';F.za=addD(k0,-1)+'T23:00';F.zb=k0+'T07:00'}
const ss=S.sleep.s.filter(x=>days.includes(x.b.slice(0,10))),tt=k=>D[k].t;
const l7=[...Array(7)].map((_,i)=>addD(k0,-i)).filter(k=>D[k]),p7=[...Array(7)].map((_,i)=>addD(k0,-i-7)).filter(k=>D[k]);
let an='';if(!L.length)an='Log a few sessions to see an analysis.';else{const a=avg(L.map(tt)),df=a-g;
an=`<p><b>Vs goal:</b> over the last ${n} days you averaged ${hm(a)} per day, ${hm(Math.abs(df))} ${df>=0?'above':'below'} your ${g} h goal.</p>`;
if(l7.length&&p7.length){const x=avg(l7.map(tt)),y=avg(p7.map(tt));an+=`<p><b>Week on week:</b> ${hm(x)} per day in the last 7 days vs ${hm(y)} in the 7 before (${x>=y?'up':'down'} ${hm(Math.abs(x-y))}).</p>`}else an+='<p><b>Week on week:</b> not enough data to compare yet.</p>';
if(L.length>1){const b=L.map(k=>D[k].bed),m=avg(b),sdv=Math.sqrt(avg(b.map(z=>(z-m)**2)));an+=`<p><b>Bedtime consistency:</b> ${sdv<=30?'very consistent':sdv<=60?'fairly consistent':'irregular'} (varies by about ±${Math.round(sdv)} min).</p>`}else an+='<p><b>Bedtime consistency:</b> needs two or more days.</p>';
const np=avg(L.map(k=>D[k].p)),nn=avg(L.map(k=>D[k].n));an+=np>0?`<p><b>Naps:</b> add ${hm(np)} per day (${Math.round(np/a*100)}% of your sleep); night sleep alone averages ${hm(nn)}.</p>`:'<p><b>Naps:</b> none logged in this range.</p>'}
const rec=[...S.sleep.s].sort((a,b)=>b.b.localeCompare(a.b)).slice(0,15).map(x=>`<div class=li><span>${isN(x)?'🌙':'💤'} <b>${hm(dur(x))}</b><br><span class=mu>${sd(x.a.slice(0,10))} ${t12(mn(x.a))} → ${sd(x.b.slice(0,10))} ${t12(mn(x.b))}</span></span><button class=dng onclick="conf('s${x.id}',()=>{S.sleep.s=S.sleep.s.filter(z=>z.id!=='${x.id}');save();go()})">${arm==='s'+x.id?'Sure?':'✕'}</button></div>`).join('');
return `<h1>Sleep</h1><div class=card><h2>Log a session</h2><select onchange="F.zt=this.value">${['Night sleep','Nap'].map(o=>`<option ${F.zt==o?'selected':''}>${o}</option>`).join('')}</select>
<div class=mu style="margin-top:8px">Fell asleep</div><input type=datetime-local value="${F.za}" onchange="F.za=this.value"><div class=mu style="margin-top:8px">Woke up</div><input type=datetime-local value="${F.zb}" onchange="F.zb=this.value">
<div class=add><button class=pri style="width:100%" onclick="addS()">Add session</button></div><p class=mu>A session counts toward the day you wake up.</p></div>
<div class=card><div class=row><span>Daily goal (hours)</span><input type=number inputmode=decimal step=any value="${g}" style="width:90px;margin:0" onchange="const x=parseFloat(this.value);if(x>0){S.sleep.goal=x;save();go()}"></div></div>
${chips([7,14,30],slR,'slR')}<div class=card><h2>Night sleep <span style="color:var(--ac)">■</span> vs naps <span style="color:var(--nap)">■</span></h2>${bars(days.map(k=>({v:D[k]?[D[k].n,D[k].p]:[0,0],t:sh(k)})),g,x=>x+'h')}</div>
<div class=grid><div class=stat><span class=mu>Average per day</span><b>${L.length?hm(avg(L.map(tt))):'–'}</b></div><div class=stat><span class=mu>Days at goal</span><b>${L.filter(k=>tt(k)>=g).length} / ${n}</b></div>
<div class=stat><span class=mu>Avg bedtime</span><b>${L.length?t12(avg(L.map(k=>D[k].bed))):'–'}</b></div><div class=stat><span class=mu>Avg wake-up</span><b>${L.length?t12(avg(L.map(k=>D[k].wk))):'–'}</b></div>
<div class=stat><span class=mu>Naps</span><b>${ss.filter(x=>!isN(x)).length}</b></div><div class=stat><span class=mu>Longest session</span><b>${ss.length?hm(Math.max(...ss.map(dur))):'–'}</b></div></div>
<div class=card><h2>Analysis</h2>${an}</div><div class=card><h2>Recent sessions</h2>${rec||'<div class=mu>No sessions yet.</div>'}</div>`}
function addS(){const d=(new Date(F.zb)-new Date(F.za))/36e5;if(!(d>0&&d<=24))return toast('Wake-up must be after fell-asleep (max 24 h)');S.sleep.s.push({id:uid(),t:F.zt||'Night sleep',a:F.za,b:F.zb});F.za='';save();go()}

/* SPEND */
function vSpend(){const m=spM==='m',pre=m?cy+'-'+p2(cm+1):''+cy,prev=m?(cm?cy+'-'+p2(cm):(cy-1)+'-12'):''+(cy-1);
const tot=s=>S.spend.filter(e=>e.d.startsWith(s)).reduce((a,e)=>a+e.a,0),items=S.spend.filter(e=>e.d.startsWith(pre)).sort((a,b)=>b.d.localeCompare(a.d)),T=items.reduce((a,e)=>a+e.a,0),P=tot(prev);
const now=new Date(),cur=m?(cy==now.getFullYear()&&cm==now.getMonth()):cy==now.getFullYear(),dn=m?(cur?now.getDate():new Date(cy,cm+1,0).getDate()):(cur?now.getMonth()+1:12);
const lab=m?new Date(cy,cm,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}):cy,ch=P>0?`<span style="color:var(${T>P?'--bad':'--ok'})">${T>=P?'▲':'▼'} ${Math.abs(Math.round((T-P)/P*100))}%</span> vs ${m?'last month':'last year'}`:`No spending in the previous ${m?'month':'year'}`;
const by={};items.forEach(e=>by[e.c]=(by[e.c]||0)+e.a);const bl=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,x])=>`<div style="margin-bottom:8px"><div class=row><span>${esc(c)}</span><span>${fm2(x)} · ${Math.round(x/T*100)}%</span></div>${bar(x/T*100)}</div>`).join('');
const cats=S.cats.length?S.cats:[];F.pc=cats.includes(F.pc)?F.pc:cats[0];
return `<h1>Spend</h1><div class=card><h2>Add expense (QAR)</h2><input type=number inputmode=decimal step=any placeholder="Amount" value="${v('pa')}" oninput="F.pa=this.value">
<select onchange="F.pc=this.value">${cats.map(c=>`<option ${c==F.pc?'selected':''}>${esc(c)}</option>`).join('')}</select><input type=date value="${v('pd',today())}" onchange="F.pd=this.value"><input placeholder="Note (optional)" value="${v('pn')}" oninput="F.pn=this.value">
<div class=add><button class=pri style="width:100%" onclick="addE()">Add expense</button></div></div>
${chips(['m','y'],spM,'spM',x=>x=='m'?'Monthly':'Yearly')}<div class=card><div class=row><button onclick="sNav(-1)">◀</button><b>${lab}</b><button onclick="sNav(1)">▶</button></div></div>
<div class=grid><div class=stat><span class=mu>Total</span><b>${fm2(T)}</b></div><div class=stat><span class=mu>Average per ${m?'day':'month'}</span><b>${fm2(T/dn)}</b></div></div><div class="card mu">${ch}</div>
${m?'':`<div class=card><h2>Months</h2>${bars([...Array(12)].map((_,i)=>({v:[tot(cy+'-'+p2(i+1))],t:'JFMAMJJASOND'[i]})),0)}</div>`}
<div class=card><h2>By category</h2>${bl||'<div class=mu>No expenses in this period.</div>'}</div>
<div class=card><h2>Transactions</h2>${items.map(e=>`<div class=li><span><b>${esc(e.c)}</b><br><span class=mu>${sd(e.d)}${e.n?' · '+esc(e.n):''}</span></span><span>${fm2(e.a)} <button class=dng onclick="conf('e${e.id}',()=>{S.spend=S.spend.filter(z=>z.id!=='${e.id}');save();go()})">${arm==='e'+e.id?'Sure?':'✕'}</button></span></div>`).join('')||'<div class=mu>Nothing here yet.</div>'}</div>
<div class=card><h2>Categories</h2>${cats.map((c,i)=>`<span class=chip>${esc(c)} <a onclick="S.cats.splice(${i},1);save();go()">✕</a></span>`).join('')}<div class=add><input placeholder="New category" value="${v('cn')}" oninput="F.cn=this.value"><button class=pri onclick="addC()">Add</button></div><p class=mu>Removing a category keeps the name on past expenses.</p></div>`}
function sNav(d){if(spM=='m'){cm+=d;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}}else cy+=d;go()}
function addE(){const a=parseFloat(F.pa);if(!(a>0))return toast('Enter an amount');if(!F.pc)return toast('Add a category first');const d=F.pd||today();S.spend.push({id:uid(),a,c:F.pc,d,n:(F.pn||'').trim()});cy=+d.slice(0,4);cm=+d.slice(5,7)-1;F.pa=F.pn='';save();go()}
function addC(){const c=(F.cn||'').trim();if(!c||S.cats.includes(c))return;S.cats.push(c);F.cn='';save();go()}

/* WEEK */
const monKey=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return dk(d)};
function rollWeek(){const m=monKey();if(S.week.mon!==m){S.week.items=S.week.items.filter(i=>!i.done);S.week.mon=m;save()}}
function vWeek(){const I=S.week.items;return `<h1>Week</h1><div class=card><div class=mu>Week of ${sd(S.week.mon)} · ${I.filter(i=>i.done).length} of ${I.length} done</div><div class=add><input placeholder="Add a task" value="${v('wn')}" oninput="F.wn=this.value" onkeydown="if(event.key==='Enter')addT()"><button class=pri onclick="addT()">Add</button></div></div>
<div class=card>${I.map(i=>`<div class=li><label class=row style="justify-content:flex-start;flex:1"><input type=checkbox ${i.done?'checked':''} onchange="tg('${i.id}')"><span style="${i.done?'text-decoration:line-through;color:var(--mu)':''}">${esc(i.t)}</span></label><button class=dng onclick="S.week.items=S.week.items.filter(z=>z.id!=='${i.id}');save();go()">✕</button></div>`).join('')||'<div class=mu>No tasks this week.</div>'}</div>
<p class=mu>On Sunday, ticked tasks disappear and unticked ones carry over.</p>`}
function addT(){const t=(F.wn||'').trim();if(!t)return;S.week.items.push({id:uid(),t,done:false});F.wn='';save();go()}
function tg(id){const i=S.week.items.find(x=>x.id===id);i.done=!i.done;save();go()}

/* HABITS + EXPORT */
function vHabits(){return `<h1>Habits</h1><div class=card><h2>New habit</h2><input placeholder="Name (e.g. Water)" value="${v('hn')}" oninput="F.hn=this.value">
<div class=add><input list=units placeholder="Unit (pick or type)" value="${v('hu')}" oninput="F.hu=this.value"><input type=number inputmode=decimal step=any placeholder="Daily goal" value="${v('hg')}" oninput="F.hg=this.value"></div>
<datalist id=units>${U.map(u=>`<option>${u}`).join('')}</datalist><div class=add><button class=pri style="width:100%" onclick="addH()">Add habit</button></div></div>`+
S.habits.map(h=>{const e=ed==='g'+h.id;return `<div class=card><div class=row><div><b>${esc(h.name)}</b><div class=mu>Goal ${fmt(h.goal)} ${esc(h.unit)} / day</div></div><div class=add style="margin:0"><button onclick="ed='g${h.id}';F.eg=${h.goal};go()">Edit goal</button><button class=dng onclick="conf('h${h.id}',()=>{S.habits=S.habits.filter(z=>z.id!=='${h.id}');delete S.logs['${h.id}'];save();go()})">${arm==='h'+h.id?'Sure?':'Delete'}</button></div></div>`+
(e?`<div class=add><input type=number inputmode=decimal step=any value="${v('eg')}" oninput="F.eg=this.value"><button class=pri onclick="saveG('${h.id}')">Save</button><button onclick="ed='';go()">✕</button></div>`:'')+`</div>`}).join('')+
`<div class=card><h2>Export</h2><div class=add><button class=pri style="flex:1" onclick="ex('json')">Everything (JSON)</button></div><div class=add><button style="flex:1" onclick="ex('habits')">Habits CSV</button><button style="flex:1" onclick="ex('sleep')">Sleep CSV</button><button style="flex:1" onclick="ex('spend')">Spend CSV</button></div></div>`}
function addH(){const name=(F.hn||'').trim(),goal=parseFloat(F.hg);if(!name||!(goal>0))return toast('Enter a name and a goal above 0');S.habits.push({id:uid(),name,unit:(F.hu||'times').trim(),goal});F.hn=F.hu=F.hg='';save();go()}
function saveG(id){const g=parseFloat(F.eg);if(!(g>0))return toast('Goal must be above 0');S.habits.find(h=>h.id===id).goal=g;ed='';save();go()}
const q=x=>'"'+String(x).replace(/"/g,'""')+'"',csv=r=>r.map(a=>a.map(q).join(',')).join('\n');
async function ex(w){const f=w=='json'?'.json':'.csv',n='daily-tracker-'+(w=='json'?'all':w)+'-'+today()+f;let d;
if(w=='json')d=JSON.stringify(S,null,2);
if(w=='habits'){const r=[['date','habit','unit','goal','amount','percent_of_goal']];S.habits.forEach(h=>Object.keys(S.logs[h.id]||{}).sort().forEach(k=>r.push([k,h.name,h.unit,h.goal,amt(h,k),Math.round(pct(h,k))])));d=csv(r)}
if(w=='sleep'){const r=[['wake_date','type','fell_asleep','woke_up','hours']];S.sleep.s.slice().sort((a,b)=>a.b.localeCompare(b.b)).forEach(x=>r.push([x.b.slice(0,10),x.t,x.a.replace('T',' '),x.b.replace('T',' '),dur(x).toFixed(2)]));d=csv(r)}
if(w=='spend'){const r=[['date','category','amount_qar','note']];S.spend.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(e=>r.push([e.d,e.c,e.a,e.n||'']));d=csv(r)}
try{const dl=window.claude&&await claude.use('downloads');if(dl)await dl.save({filename:n,data:d});else{const fl=new File([d],n,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.click()}}catch(e){if(!e||e.code!=='declined')toast('Could not save the file')}}

/* SHELL */
const TABS=[['today','☀️','Today'],['stats','📊','Stats'],['sleep','🌙','Sleep'],['spend','💳','Spend'],['week','📅','Week'],['habits','✅','Habits']],V={today:vToday,stats:vStats,sleep:vSleep,spend:vSpend,week:vWeek,habits:vHabits};
$('#n').innerHTML=TABS.map(t=>`<button data-t=${t[0]} onclick="sw('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
function sw(t){tab=t;ed='';arm='';scrollTo(0,0);go()}
function go(){rollWeek();$('#m').innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)go()});
go();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
